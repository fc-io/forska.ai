<!doctype html>
<html>
  <head>
    <title>forska.ai</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232c4f7c'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-family='monospace' font-size='16' font-weight='bold'%3ED%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const locationHash = window.location.hash.replace(/^#/, '')
        const desktopApiOrigin =
          new URLSearchParams(window.location.search).get('apiOrigin')
          ?? new URLSearchParams(locationHash).get('apiOrigin')

        if (desktopApiOrigin) {
          window.__FORSKA_DESKTOP_API_ORIGIN__ = desktopApiOrigin.replace(/\/+$/, '')
        }
      })()
    </script>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
