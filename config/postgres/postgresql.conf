# Custom PostgreSQL configuration for ClickHouse MaterializedPostgreSQL replication
# This file enables logical replication required for streaming changes to ClickHouse

# Listen on all network interfaces (required for Docker container-to-container communication)
listen_addresses = '*'

# Enable logical replication (required for MaterializedPostgreSQL)
wal_level = logical

# Maximum number of concurrent WAL sender processes
# (one sender per replication slot/consumer)
max_wal_senders = 10

# Maximum number of replication slots
# (one slot per ClickHouse MaterializedPostgreSQL database)
max_replication_slots = 10

# Optional: Control WAL retention to prevent disk exhaustion if CH consumer goes offline
# Keep at least 1GB of WAL (adjust based on disk space and expected lag)
# wal_keep_size = 1024MB

# Optional: Increase checkpoint timeout to reduce I/O (default is 5min)
# checkpoint_timeout = 10min
