name: Actions security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  # Relock locally with `gh actions-lock` after changing any `uses:` line.
  lockfile:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # Static security audit of the workflows (unpinned actions, credential
  # persistence, template injection, ...). Fails on any finding.
  zizmor:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
