name: Judgment workflow topology

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "*.mdx"
      - "README*"
      - "CHANGELOG*"
      - "CONTRIBUTING*"
      - "SECURITY*"
      - "CODE_OF_CONDUCT*"
      - "SUPPORT*"
      - "LICENSE*"
      - "NOTICE*"
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Cross-platform topology contracts
        run: bun test scripts/judgmentWorkflowTopology.test.ts scripts/processLockAcquisition.test.ts src/server/utils/backgroundServerStack.test.ts src/server/utils/judgeWorkerJournalIdentity.test.ts src/server/cron/judgmentsJobs/judgmentJobPaths.test.ts
      - name: Production judgment topology
        run: bun run test:judgment-workflow:topology
