# ./docker-compose.yaml
# Compose v2+ (no version key needed)
name: forska-stack

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres} -h 127.0.0.1 -p 5432']
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  sglang:
    profiles: ['gpu']
    image: ghcr.io/${GHCR_OWNER:-local}/sglang-server:${TAG:-dev}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.sglang
    entrypoint: ['python', '-m', 'sglang.launch_server']
    environment:
      HF_HOME: /cache/hf
      XDG_CACHE_HOME: /cache/xdg
      SGLANG_CACHE_DIR: /cache/sglang
      MODEL_PATH: ${MODEL_PATH:-/models/Qwen3-32B-FP8}
      TP_SIZE: ${TP_SIZE:-1}
    volumes:
      - ${HOST_MODELS_DIR:-./models}:/models:ro
      - ./cache/hf:/cache/hf
      - ./cache/xdg:/cache/xdg
      - ./cache/sglang:/cache/sglang
    command: >
      --model-path ${MODEL_PATH:-/models/Qwen3-32B-FP8}
      --host 0.0.0.0
      --port 30000
      --tensor-parallel-size ${TP_SIZE:-1}
      --trust-remote-code
      --max-running-requests ${MAX_RUNNING_REQUESTS:-32}
      --enable-metrics
      --download-dir /cache/hf
    gpus: all
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:30000/v1/models >/dev/null']
      interval: 20s
      timeout: 5s
      retries: 12
    ports:
      - '30000:30000'

  docling:
    image: ghcr.io/docling-project/docling-serve
    ports:
      - '5001:5001'
    volumes:
      - ./cache/docling:/opt/app-root/src/.cache/docling
    environment:
      DOCLING_SERVE_ARTIFACTS_PATH: /opt/app-root/src/.cache/docling/models
      GUNICORN_TIMEOUT: '600'
      DOCLING_SERVE_MAX_SYNC_WAIT: '600'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:5001/health > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:-postgres}@db:5432/${DB_NAME:-postgres}
      VITE_LLM_SERVER_URL: http://sglang:30000/v1
      API_SERVER_PORT: 3000
      VITE_PORT: 8080
      NODE_ENV: production
      OPENAI_API_KEY: ${SGLANG_API_KEY:-fake_key}
      MODEL_ID: /models/Qwen3-32B-FP8
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    ports:
      - '3000:3000'

  app-server:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:-postgres}@db:5432/${DB_NAME:-postgres}
        VITE_PORT: '8080'
        API_SERVER_PORT: '3000'
        VITE_LLM_SERVER_URL: http://sglang:30000/v1
        VITE_SERVER_API: ${VITE_SERVER_API:-http://localhost:3000}
        OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    env_file:
      - .env.local
    environment:
      SERVER_HOST: api-server
      API_SERVER_PORT: 3000
      PROD_SERVER: 8080
      NODE_ENV: production
      VITE_LLM_SERVER_URL: http://sglang:30000/v1
    ports:
      - '8080:8080'

  db-hostnet:
    profiles: ['hostnet']
    image: postgres:18
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres} -h 127.0.0.1 -p 5432']
      interval: 10s
      timeout: 5s
      retries: 6
    network_mode: host
    secrets:
      - db_password

  api-server-hostnet:
    profiles: ['hostnet']
    image: ghcr.io/${GHCR_OWNER:-local}/api-server:${TAG:-dev}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      VITE_LLM_SERVER_URL: http://localhost:30000/v1
      API_SERVER_PORT: 3000
      VITE_PORT: 8080
      NODE_ENV: production
      OPENAI_API_KEY: ${SGLANG_API_KEY:-fake_key}
      MODEL_ID: /models/Qwen3-32B-FP8
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    network_mode: host
    secrets:
      - database_url

  app-server-hostnet:
    profiles: ['hostnet']
    image: ghcr.io/${GHCR_OWNER:-local}/app-server:${TAG:-dev}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        DATABASE_URL: postgresql://${DB_USER:-postgres}:***@localhost:${POSTGRES_PORT:-5432}/${DB_NAME:-postgres}
        VITE_PORT: '8080'
        API_SERVER_PORT: '3000'
        VITE_LLM_SERVER_URL: http://localhost:30000/v1
        VITE_SERVER_API: http://localhost:3000
        OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    env_file:
      - .env
    environment:
      SERVER_HOST: localhost
      API_SERVER_PORT: 3000
      PROD_SERVER: 8080
      NODE_ENV: production
      VITE_LLM_SERVER_URL: http://localhost:30000/v1
    network_mode: host

volumes:
  pgdata:

secrets:
  db_password:
    file: ${STACK_ROOT:-.}/.secrets/db_password.txt
  database_url:
    file: ${STACK_ROOT:-.}/.secrets/database_url.txt
