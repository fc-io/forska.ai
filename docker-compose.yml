# ./docker-compose.yaml
# Compose v2+ (no version key needed)
name: forska-stack

x-caches: &caches
  HF_HOME: /cache/hf
  XDG_CACHE_HOME: /cache/xdg
  VLLM_CACHE_ROOT: /cache/vllm
  TORCHINDUCTOR_CACHE_DIR: /cache/vllm/torchinductor
  TRITON_CACHE_DIR: /cache/vllm/triton

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS in .env.local}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed database on first init; files run in alphanumeric order
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # optional for local psql access

  vllm:
    image: vllm/vllm-openai:latest
    shm_size: "8gb"
    environment:
      <<: *caches
      VLLM_API_KEY: ${VLLM_API_KEY:?set in .env.local}
      # tuneables
      VLLM_GPU_UTIL: ${VLLM_GPU_UTIL:-0.90}
      TP_SIZE: ${TP_SIZE:-1}           # set to your local GPU count (e.g., 4)
    volumes:
      - ${HOST_MODELS_DIR:-./models}:/models:ro
      - ./cache/hf:/cache/hf
      - ./cache/xdg:/cache/xdg
      - ./cache/vllm:/cache/vllm
    command: >
      --model /models/Qwen3-32B-FP8
      --host 0.0.0.0 --port 8000
      --tensor-parallel-size ${TP_SIZE:-1}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.90}
      --api-key ${VLLM_API_KEY}
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Authorization: Bearer ${VLLM_API_KEY}' http://localhost:8000/v1/models >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"

  sglang-gateway:
    image: ghcr.io/sgl-project/sglang-gateway:0.5.4
    environment:
      HF_HOME: /cache/hf
      XDG_CACHE_HOME: /cache/xdg
    volumes:
      - ./cache/hf:/cache/hf
      - ./cache/xdg:/cache/xdg
    command: >
      --host 0.0.0.0
      --port 30000
      --allow-credentials
      --max-queue-size 256
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/v1/models >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
    ports:
      - "30000:30000"

  sglang-worker:
    image: ghcr.io/sgl-project/sglang-worker:0.5.4
    environment:
      HF_HOME: /cache/hf
      XDG_CACHE_HOME: /cache/xdg
      SGLANG_CACHE_DIR: /cache/sglang
      SGLANG_GATEWAY_URL: http://sglang-gateway:30000
      MODEL_PATH: ${MODEL_PATH:-/models/Qwen3-32B-FP8}
      TP_SIZE: ${TP_SIZE:-1}
    volumes:
      - ${HOST_MODELS_DIR:-./models}:/models:ro
      - ./cache/hf:/cache/hf
      - ./cache/xdg:/cache/xdg
      - ./cache/sglang:/cache/sglang
    command: >
      --model-path ${MODEL_PATH:-/models/Qwen3-32B-FP8}
      --gateway ${SGLANG_GATEWAY_URL:-http://sglang-gateway:30000}
      --tp-size ${TP_SIZE:-1}
      --max-batch-size ${MAX_BATCH_SIZE:-32}
      --cache-dir ${SGLANG_CACHE_DIR:-/cache/sglang}
    gpus: all
    depends_on:
      - sglang-gateway

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:?set DB_PASS in .env.local}@db:5432/${DB_NAME:-postgres}
      VLLM_BASE_URL: http://vllm:8000/v1
      VITE_LLM_SERVER_URL: http://vllm:8000/v1
      API_SERVER_PORT: 3000
      VITE_PORT: 8080
      NODE_ENV: production
      OPENAI_API_KEY: ${VLLM_API_KEY}
      MODEL_ID: /models/Qwen3-32B-FP8
    ports:
      - "3000:3000"

  app-server:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:?set DB_PASS in .env.local}@db:5432/${DB_NAME:-postgres}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required in .env.local}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL required in .env.local}
        VITE_PORT: "8080"
        API_SERVER_PORT: "3000"
        VITE_LLM_SERVER_URL: http://vllm:8000/v1
        VITE_SERVER_API: ${VITE_SERVER_API:?VITE_SERVER_API required in .env.local}
    env_file:
      - .env.local
    environment:
      SERVER_HOST: api-server
      API_SERVER_PORT: 3000
      PROD_SERVER: 8080
      NODE_ENV: production
    # depends_on:
    #   api-server:
    #     condition: service_healthy
    ports:
      - "8080:8080"

  # Host-network variants to simulate Apptainer/Singularity where localhost is shared
  # These services are only included when the 'hostnet' profile is enabled.
  db-hostnet:
    profiles: ["hostnet"]
    image: postgres:18
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 6
    network_mode: host
    secrets:
      - db_password

  vllm-hostnet:
    profiles: ["hostnet"]
    image: vllm/vllm-openai:latest
    platform: linux/amd64
    shm_size: "8gb"
    environment:
      <<: *caches
      VLLM_API_KEY: ${VLLM_API_KEY:?set in .env}
      VLLM_GPU_UTIL: ${VLLM_GPU_UTIL:-0.90}
      TP_SIZE: ${TP_SIZE:-1}
    volumes:
      - ${HOST_MODELS_DIR:-./models}:/models:ro
      - ./cache/hf:/cache/hf
      - ./cache/xdg:/cache/xdg
      - ./cache/vllm:/cache/vllm
    command: >
      --model /models/Qwen3-32B-FP8
      --host 0.0.0.0 --port 8000
      --tensor-parallel-size ${TP_SIZE:-1}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.90}
      --api-key ${VLLM_API_KEY}
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Authorization: Bearer ${VLLM_API_KEY}' http://localhost:8000/v1/models >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
    network_mode: host

  api-server-hostnet:
    profiles: ["hostnet"]
    image: ghcr.io/${GHCR_OWNER:-local}/api-server:${TAG:-dev}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      VLLM_BASE_URL: http://localhost:8000/v1
      VITE_LLM_SERVER_URL: http://localhost:8000/v1
      API_SERVER_PORT: 3000
      VITE_PORT: 8080
      NODE_ENV: production
      OPENAI_API_KEY: ${VLLM_API_KEY}
      MODEL_ID: /models/Qwen3-32B-FP8
    network_mode: host
    secrets:
      - database_url

  app-server-hostnet:
    profiles: ["hostnet"]
    image: ghcr.io/${GHCR_OWNER:-local}/app-server:${TAG:-dev}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        DATABASE_URL: postgresql://${DB_USER:-postgres}:***@localhost:${POSTGRES_PORT:-5432}/${DB_NAME:-postgres}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL required in .env}
        VITE_PORT: "8080"
        API_SERVER_PORT: "3000"
        VITE_LLM_SERVER_URL: http://localhost:8000/v1
        VITE_SERVER_API: http://localhost:3000
    env_file:
      - .env
    environment:
      SERVER_HOST: localhost
      API_SERVER_PORT: 3000
      PROD_SERVER: 8080
      NODE_ENV: production
    network_mode: host

volumes:
  pgdata:
secrets:
  db_password:
    file: ${STACK_ROOT:-.}/.secrets/db_password.txt
  database_url:
    file: ${STACK_ROOT:-.}/.secrets/database_url.txt
